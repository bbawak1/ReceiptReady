name: Deploy project site to Azure

on:
  push:
    branches: [ "dev" ]
    paths: [ "code/project-site/**", ".github/workflows/deploy-site.yml" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: |
        cd "code/project-site/"
        npm install
        cd ../..

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: receiptready-bbawak1
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: code/project-site