name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven verify
        working-directory: code
        run: mvn --batch-mode --update-snapshots verify
